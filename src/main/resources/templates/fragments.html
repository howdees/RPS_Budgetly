<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header(active)" class="site-header">
  <div class="container nav">
    <a class="logo" th:href="@{/}">Budget<span>ly</span></a>
    <nav class="nav-links">
      <th:block sec:authorize="!isAuthenticated()">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">Главная</a>
        <a href="/#features">Возможности</a>
        <a th:href="@{/faq}" th:classappend="${active == 'faq'} ? ' is-active'">Термины</a>
        <a th:href="@{/login}" th:classappend="${active == 'login'} ? ' is-active'">Вход</a>
        <a th:href="@{/register}" th:classappend="${active == 'register'} ? ' is-active'">Регистрация</a>
      </th:block>
      <th:block sec:authorize="isAuthenticated()">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">О проекте</a>
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? ' is-active'">Обзор</a>
        <a th:href="@{/faq}" th:classappend="${active == 'faq'} ? ' is-active'">Термины</a>
        <span class="muted" sec:authentication="name">user</span>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? ' is-active'">Кабинет</a>
        <form th:action="@{/logout}" method="post" style="display:inline;margin:0;">
          <button class="btn btn-secondary" type="submit" style="min-height:2rem;padding:0.3rem 0.9rem;">Выйти</button>
        </form>
      </th:block>
    </nav>
  </div>
</header>

<aside th:fragment="sidebar(active)" class="side-nav">
  <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? ' is-active'">Обзор</a>
  <a th:href="@{/analytics}" th:classappend="${active == 'analytics'} ? ' is-active'">Аналитика</a>
  <a th:href="@{/transactions}" th:classappend="${active == 'transactions'} ? ' is-active'">Транзакции</a>
  <a th:href="@{/categories}" th:classappend="${active == 'categories'} ? ' is-active'">Категории</a>
  <a th:href="@{/tags}" th:classappend="${active == 'tags'} ? ' is-active'">Теги</a>
  <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? ' is-active'">Личный кабинет</a>
  <a th:href="@{/admin}" th:classappend="${active == 'admin'} ? ' is-active'" sec:authorize="hasRole('ADMIN')">Пользователи</a>
</aside>

<th:block th:fragment="flash">
  <div th:if="${message}" class="notice" th:text="${message}"></div>
  <div th:if="${error}" class="notice notice-locked" th:text="${error}"></div>
</th:block>

<th:block th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Budgetly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</th:block>
</body>
</html>
